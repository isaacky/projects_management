[project]
name = "pm-platform-analytics"
version = "0.1.0"
description = "Portfolio analytics for the PM platform (read-only over PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "polars>=1.32",
    "sqlalchemy>=2.0.43",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
    "ruff>=0.12",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
